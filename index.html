<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101116">
<meta name="description" content="Nova AI Chat — a fast, beautiful AI chat assistant powered by Puter.js.">
<meta name="application-name" content="Nova AI Chat">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon.svg">

<title>Nova — AI Chat</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#17181f;--panel2:#20212a;--line:#2b2d38;--text:#f4f4f7;--muted:#a0a2b2;--accent:#a78bfa;--accent2:#7c3aed;--user:#29223a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100dvh;overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;border:0}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:var(--app-height,100dvh);min-height:0;display:grid;grid-template-columns:270px 1fr}.sidebar{background:#13141a;border-right:1px solid var(--line);padding:18px 13px;display:flex;flex-direction:column;min-height:0}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;font-size:19px;font-weight:750;letter-spacing:-.5px}.logo{width:34px;height:34px;display:grid;place-items:center;background:linear-gradient(135deg,#a78bfa,#6d28d9);border-radius:12px;color:white}.new-chat{background:var(--panel2);border:1px solid #383946;border-radius:12px;padding:11px 12px;text-align:left;display:flex;gap:9px;align-items:center;width:100%;margin-bottom:18px}.section-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.1px;padding:8px}.history{overflow:auto;flex:1}.history-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;padding:10px;border-radius:9px;color:#c8c8d2;margin:2px 0}.history-item:hover,.history-item.active{background:var(--panel2);color:white}.history-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.history-item .del{opacity:0;color:var(--muted);padding:2px 5px}.history-item:hover .del{opacity:1}.side-bottom{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.side-link{background:transparent;color:var(--muted);display:flex;gap:9px;align-items:center;padding:10px;width:100%;text-align:left;border-radius:9px}.side-link:hover{background:var(--panel2);color:var(--text)}.main{min-width:0;min-height:0;height:100%;display:flex;flex-direction:column;position:relative}.topbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:12px}.model-select{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:8px 10px;border-radius:9px;max-width:220px}.top-actions{display:flex;gap:8px;align-items:center}.small-btn{background:transparent;border:1px solid var(--line);padding:8px 10px;border-radius:9px;color:var(--muted)}.small-btn:hover{color:white;background:var(--panel2)}.chat-area{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;scroll-behavior:smooth}.welcome{max-width:800px;margin:10vh auto 0;padding:24px}.welcome-mark{width:58px;height:58px;display:grid;place-items:center;border:1px solid #393348;background:#211a30;border-radius:20px;font-size:28px;margin-bottom:25px}.welcome h1{font-size:clamp(28px,4vw,43px);letter-spacing:-1.6px;line-height:1.13;margin:0 0 12px}.welcome p{color:var(--muted);margin:0 0 28px}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.suggestion{background:var(--panel);border:1px solid var(--line);padding:15px;text-align:left;border-radius:13px;transition:.15s}.suggestion:hover{border-color:#7862aa;transform:translateY(-1px)}.suggestion b{display:block;font-weight:600;margin-bottom:4px}.suggestion small{color:var(--muted);font-size:13px}.messages{max-width:850px;margin:0 auto;padding:30px 24px 40px}.message{display:flex;gap:13px;margin:0 0 27px;align-items:flex-start}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:10px;display:grid;place-items:center;font-size:13px;background:#292a35;color:#ddd}.message.assistant .avatar{background:#302344;color:#d8c4ff}.bubble{min-width:0;flex:1;overflow-wrap:anywhere}.role{font-size:12px;color:var(--muted);margin:2px 0 7px}.content{white-space:pre-wrap;line-height:1.75}.content pre{white-space:pre;overflow:auto;background:#0c0d11;border:1px solid var(--line);padding:14px;border-radius:10px}.content code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#252630;padding:2px 5px;border-radius:4px;font-size:.92em}.content pre code{background:none;padding:0}.msg-actions{display:flex;gap:6px;margin-top:9px}.msg-actions button{font-size:12px;background:transparent;color:var(--muted);padding:5px 7px;border-radius:6px}.msg-actions button:hover{background:var(--panel2);color:white}.typing{display:flex;gap:5px;padding:10px 0}.typing i{width:6px;height:6px;border-radius:50%;background:#b8a4e9;animation:pulse 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes pulse{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}.composer-wrap{flex:0 0 auto;position:relative;z-index:20;padding:12px 22px calc(16px + env(safe-area-inset-bottom, 0px));background:var(--bg)}.composer{max-width:850px;margin:auto;background:var(--panel);border:1px solid #393a47;border-radius:17px;padding:11px 12px 9px;box-shadow:0 10px 40px #0002}.composer:focus-within{border-color:#6b5a91}.composer textarea{display:block;width:100%;min-height:48px;max-height:min(180px,25dvh);resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:5px 6px;line-height:1.55}.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.composer-hint{color:var(--muted);font-size:11px;padding-left:5px}.composer-actions{display:flex;gap:7px;align-items:center}.attach-btn{width:35px;height:35px;border-radius:10px;background:transparent;color:var(--muted)}.attach-btn:hover{background:var(--panel2);color:white}.send-btn{width:37px;height:37px;border-radius:11px;background:var(--accent);color:#17121f;font-weight:800;font-size:18px}.send-btn:disabled{opacity:.35;cursor:not-allowed}.disclaimer{text-align:center;color:#777989;font-size:11px;margin-top:10px}.empty-note{text-align:center;color:var(--muted);padding:20px}.mobile-menu{display:none}.modal-backdrop{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:22px}.modal h2{font-size:20px;margin:0 0 16px}.modal label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}.modal input,.modal select{width:100%;background:#101116;border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--text)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.primary{background:var(--accent);color:#191323;border-radius:9px;padding:9px 14px;font-weight:650}.muted-btn{background:var(--panel2);border-radius:9px;padding:9px 14px}.status{font-size:12px;color:var(--muted);margin-left:auto}.toast{position:absolute;top:72px;left:50%;transform:translateX(-50%);background:#292936;border:1px solid var(--line);padding:9px 14px;border-radius:10px;z-index:5;box-shadow:0 8px 24px #0005}.hidden{display:none!important}
@media(max-width:700px){.app{grid-template-columns:minmax(0,1fr);width:100%;overflow:hidden}.main{min-width:0;min-height:0}.chat-area{min-width:0}.composer-wrap{position:sticky;bottom:0;flex:0 0 auto;width:100%;padding:8px 10px calc(10px + env(safe-area-inset-bottom, 0px));background:var(--bg);z-index:20}.composer{width:100%;}.composer textarea{max-height:min(150px,22dvh);}.composer-actions{display:flex;flex:0 0 auto;align-items:center;gap:7px}.send-btn{display:grid!important;place-items:center;flex:0 0 42px;width:42px;height:42px;min-width:42px;visibility:visible!important;opacity:1!important;background:var(--accent);color:#17121f;position:relative;z-index:21;touch-action:manipulation}.send-btn:disabled{opacity:1!important;background:#51436f;color:#fff;cursor:not-allowed}.sidebar{position:fixed;z-index:8;inset:0 auto 0 0;width:280px;transform:translateX(-105%);transition:transform .2s;box-shadow:20px 0 50px #0005}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-flex}.topbar{padding:0 12px;height:58px}.composer-wrap{padding:8px 10px 10px}.messages{padding:22px 14px 30px}.welcome{margin:7vh auto 0;padding:20px}.suggestions{grid-template-columns:1fr}.model-select{max-width:155px}.top-actions .small-btn{padding:7px}.composer-hint{display:none}.content{font-size:14px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">✦</div><span>nova<span style="color:var(--accent)">.</span></span></div>
  <button class="new-chat" id="newChat"><span>＋</span> New chat <span style="margin-left:auto;color:var(--muted)">Ctrl K</span></button>
  <div class="section-label">Recent chats</div>
  <div class="history" id="history"></div>
  <div class="side-bottom">
    <button class="side-link" id="settingsBtn">⚙️ <span>Settings</span></button>
    <button class="side-link" id="exportBtn">⇩ <span>Export conversation</span></button>
    <button class="side-link" id="clearBtn">⌫ <span>Clear all chats</span></button>
    <div style="font-size:11px;color:#737586;padding:10px 8px">Powered by <a href="https://developer.puter.com" target="_blank" rel="noopener" style="color:#aaa1c9">Puter</a></div>
  </div>
</aside>
<main class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:10px;min-width:0"><button class="small-btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><select id="model" class="model-select" aria-label="AI model"><option value="gpt-5.4-nano">GPT-5.4 Nano · Fast</option><option value="gpt-5.5">GPT-5.5 · Smart</option><option value="claude-sonnet-4-5">Claude Sonnet</option><option value="gemini-2.5-flash">Gemini Flash</option></select><span id="status" class="status">Ready</span></div>
    <div class="top-actions"><button class="small-btn" id="themeBtn" title="Toggle theme">☼</button><button class="small-btn" id="signInBtn">Sign in</button></div>
  </header>
  <div class="chat-area" id="chatArea">
    <section class="welcome" id="welcome">
      <div class="welcome-mark">✦</div>
      <h1>What can I help<br>you with today?</h1>
      <p>Ask anything, explore ideas, or get something done.</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="Explain a complex topic simply, with an example."><b>✧ Explain something</b><small>Make complex ideas easy to understand</small></button>
        <button class="suggestion" data-prompt="Help me brainstorm creative ideas for a project."><b>✎ Brainstorm ideas</b><small>Explore fresh angles and possibilities</small></button>
        <button class="suggestion" data-prompt="Write a clean, responsive HTML, CSS, and JavaScript starter for a website."><b>⌘ Write some code</b><small>Build, debug, and improve code</small></button>
        <button class="suggestion" data-prompt="Help me make a practical step-by-step plan to achieve a goal."><b>↗ Make a plan</b><small>Turn a goal into actionable steps</small></button>
      </div>
    </section>
    <div class="messages hidden" id="messages" aria-live="polite"></div>
  </div>
  <div class="composer-wrap">
    <form class="composer" id="chatForm">
      <textarea id="prompt" rows="1" placeholder="Message Nova..." aria-label="Message Nova"></textarea>
      <div class="composer-bottom"><span class="composer-hint">Enter to send · Shift + Enter for new line</span><div class="composer-actions"><input type="file" id="fileInput" class="hidden" accept="image/*,.txt,.md,.csv,.json,.pdf" multiple><button class="attach-btn" type="button" id="attachBtn" title="Attach image or text file">＋</button><button class="send-btn" id="sendBtn" type="submit" aria-label="Send message">↑</button></div></div>
    </form>
    <div class="disclaimer">AI can make mistakes. Check important information.</div>
  </div>
</main>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script src="https://js.puter.com/v2/"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const STORAGE_KEY = 'nova.puter.chats.v1';
  let chats = loadChats(), currentId = null, busy = false, abortController = null, attached = [];
  let settings = {system:'You are Nova, a helpful, accurate, friendly AI assistant. Adapt to the user’s language. Use clear structure and practical examples.', temperature:0.7, maxTokens:2048};
  try { settings = {...settings, ...JSON.parse(localStorage.getItem('nova.settings') || '{}')}; } catch {}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
  function loadChats(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(x)?x:[]}catch{return []}}
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(chats))}catch{toast('Local storage is full. Export chats to keep a backup.')}}
  function current(){return chats.find(c=>c.id===currentId)}
  function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
  function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function renderHistory(){
    const root=$('history');root.innerHTML='';
    if(!chats.length){root.innerHTML='<div class="empty-note">Your chats will appear here.</div>';return}
    [...chats].sort((a,b)=>b.updated-a.updated).forEach(c=>{
      const b=document.createElement('button');b.className='history-item'+(c.id===currentId?' active':'');b.innerHTML='<span>◌</span><span>'+escapeHTML(c.title||'New chat')+'</span><span class="del" title="Delete chat">×</span>';
      b.addEventListener('click',e=>{if(e.target.classList.contains('del')){e.stopPropagation();if(confirm('Delete this conversation?')){chats=chats.filter(x=>x.id!==c.id);if(currentId===c.id)currentId=null;save();renderHistory();renderChat()}return}currentId=c.id;renderHistory();renderChat();$('sidebar').classList.remove('open')});root.appendChild(b)
    })
  }
  function newChat(){if(busy)return;currentId=null;renderHistory();renderChat();$('prompt').focus();$('sidebar').classList.remove('open')}
  function renderChat(){
    const c=current();$('welcome').classList.toggle('hidden',!!(c&&c.messages.length));$('messages').classList.toggle('hidden',!(c&&c.messages.length));$('messages').innerHTML='';
    if(!c||!c.messages.length){$('chatArea').scrollTop=0;return}
    c.messages.forEach((m,i)=>appendMessage(m,i));$('chatArea').scrollTop=$('chatArea').scrollHeight
  }
  function basicMarkdown(text){
    let s=escapeHTML(text);
    s=s.replace(/```([\w-]*)\n?([\s\S]*?)```/g,(_,lang,code)=>'<pre><code>'+code.replace(/^\n|\n$/g,'')+'</code></pre>');
    s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
    s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
    s=s.replace(/(^|\n)### (.+)/g,'$1<strong>$2</strong>').replace(/(^|\n)## (.+)/g,'$1<strong style="font-size:1.12em">$2</strong>');
    return s;
  }
  function appendMessage(m,i){
    const node=document.createElement('article');node.className='message '+m.role;
    const label=m.role==='user'?'You':'Nova';
    node.innerHTML='<div class="avatar">'+(m.role==='user'?'Y':'✦')+'</div><div class="bubble"><div class="role">'+label+'</div><div class="content">'+(m.pending?'<div class="typing"><i></i><i></i><i></i></div>':basicMarkdown(m.content||''))+'</div>'+(m.role==='assistant'&&!m.pending?'<div class="msg-actions"><button data-action="copy">Copy</button><button data-action="retry">Regenerate</button></div>':'')+'</div>';
    node.querySelector('[data-action="copy"]')?.addEventListener('click',()=>navigator.clipboard?.writeText(m.content).then(()=>toast('Copied to clipboard')).catch(()=>toast('Clipboard permission unavailable')));
    node.querySelector('[data-action="retry"]')?.addEventListener('click',()=>retryFrom(i));
    $('messages').appendChild(node)
  }
  function ensureChat(text){let c=current();if(!c){c={id:uid(),title:text.slice(0,42)+(text.length>42?'…':''),messages:[],updated:Date.now()};chats.push(c);currentId=c.id}return c}
  function setBusy(v){busy=v;$('sendBtn').disabled=v||(!$('prompt').value.trim()&&!attached.length);$('status').textContent=v?'Thinking…':'Ready';$('model').disabled=v}
  async function send(textOverride){
    if(busy)return;const text=(textOverride??$('prompt').value).trim();if(!text&&!attached.length)return;
    const files=attached.slice();attached=[];updateAttachments();$('prompt').value='';resizeInput();const c=ensureChat(text||'Attached file');c.messages.push({role:'user',content:text+(files.length?'\n\nAttached: '+files.map(f=>f.name).join(', '):''),attachments:files.map(f=>({name:f.name,type:f.type,data:f.data}))});c.updated=Date.now();save();renderHistory();renderChat();
    const pending={role:'assistant',content:'',pending:true};c.messages.push(pending);renderChat();setBusy(true);abortController=new AbortController();
    try{
      if(!window.puter?.ai?.chat)throw new Error('Puter.js did not load. Check your internet connection and reload.');
      const messages=[{role:'system',content:settings.system},...c.messages.filter(m=>!m.pending).map(m=>({role:m.role,content:messageContent(m)}))];
      const model=$('model').value;
      // Puter.js accepts images as the second argument to chat(). A filename or
      // a text-only content block does not transmit the actual image bytes.
      const imageInputs=c.messages
        .filter(m=>!m.pending)
        .flatMap(m=>(m.attachments||[])
          .filter(a=>a.type&&a.type.startsWith('image/')&&typeof a.data==='string'&&a.data.startsWith('data:image/'))
          .map(a=>a.data));
      let result;
      const options={model,stream:false,temperature:Number(settings.temperature)||0.7,max_tokens:Number(settings.maxTokens)||2048,signal:abortController.signal};
      if(imageInputs.length){
        const transcript=messages.map(m=>{
          const content=Array.isArray(m.content)
            ?m.content.map(p=>p.type==='text'?p.text:'').filter(Boolean).join('\\n')
            :String(m.content??'');
          return '['+m.role.toUpperCase()+']\\n'+content;
        }).join('\\n\\n');
        result=await puter.ai.chat(transcript,imageInputs,false,options);
      }else{
        result=await puter.ai.chat(messages,options);
      }
      let answer=extractText(result);
      if(!answer)answer='I received an empty response. Please try again.';
      c.messages.pop();c.messages.push({role:'assistant',content:answer});c.updated=Date.now();save();renderChat();renderHistory()
    }catch(err){
      c.messages.pop();
      if(err?.name==='AbortError')c.messages.push({role:'assistant',content:'Response stopped.'});
      else c.messages.push({role:'assistant',content:'Sorry, something went wrong: '+(err?.message||String(err))+'\n\nCheck your connection, try another model, or sign in to Puter if prompted.'});
      save();renderChat()
    }finally{setBusy(false);abortController=null;$('prompt').focus()}
  }
  function messageContent(m){
    if(!m.attachments?.length)return m.content;
    // Image attachments are passed as a multimodal content array; text files are included as extracted text.
    const parts=[];for(const a of m.attachments){if(a.type.startsWith('image/')&&a.data)parts.push({type:'text',text:'Attached image: '+a.name});else if(a.data)parts.push({type:'text',text:'Attached file '+a.name+':\n'+a.data.slice(0,25000)})}
    parts.push({type:'text',text:m.content});return parts;
  }
  function extractText(r){if(typeof r==='string')return r;if(typeof r?.message?.content==='string')return r.message.content;if(Array.isArray(r?.message?.content))return r.message.content.map(x=>x.text||'').join('\n');if(typeof r?.text==='string')return r.text;return ''}

  // Load the live chat-model catalogue from Puter so the picker stays current.
  async function loadModels(){
    const select=$('model'), previous=select.value;
    try{
      if(!window.puter?.ai?.listModels)throw new Error('Model catalogue is not available');
      const listed=await puter.ai.listModels();
      if(!Array.isArray(listed)||!listed.length)throw new Error('No chat models returned');
      const models=listed.filter(m=>m&&typeof m.id==='string'&&m.id.trim());
      if(!models.length)throw new Error('No valid model IDs returned');
      const preferred=['gpt-5.4-nano','gpt-5.5','claude-sonnet-4-5','gemini-2.5-flash'];
      const byId=new Map(models.map(m=>[m.id,m]));
      select.innerHTML='';
      const featured=document.createElement('optgroup');featured.label='Popular models';
      preferred.filter(id=>byId.has(id)).forEach(id=>{
        const m=byId.get(id),o=document.createElement('option');o.value=m.id;o.textContent=(m.name||m.id)+' · '+(m.provider||'');featured.appendChild(o);
      });
      if(featured.children.length)select.appendChild(featured);
      const grouped=new Map();
      models.filter(m=>!preferred.includes(m.id)).forEach(m=>{
        const provider=String(m.provider||'Other');
        if(!grouped.has(provider))grouped.set(provider,[]);
        grouped.get(provider).push(m);
      });
      [...grouped.keys()].sort((a,b)=>a.localeCompare(b)).forEach(provider=>{
        const group=document.createElement('optgroup');group.label=provider+' models';
        grouped.get(provider).sort((a,b)=>(a.name||a.id).localeCompare(b.name||b.id)).forEach(m=>{
          const o=document.createElement('option');o.value=m.id;
          o.textContent=(m.name||m.id)+'  —  '+m.id;
          o.title=m.id;
          group.appendChild(o);
        });
        select.appendChild(group);
      });
      const preferredValue=models.some(m=>m.id===previous)?previous:(models.some(m=>m.id==='gpt-5.4-nano')?'gpt-5.4-nano':models[0].id);
      select.value=preferredValue;
      $('status').textContent=models.length+' models';
      select.title='Choose from '+models.length+' currently listed chat models';
    }catch(err){
      $('status').textContent='Model list unavailable';
      console.warn('Nova could not load the live model catalogue; using built-in options.',err);
    }
  }
  async function retryFrom(i){if(busy)return;const c=current();if(!c)return;while(c.messages.length>i)c.messages.pop();save();renderChat();const last=[...c.messages].reverse().find(m=>m.role==='user');if(last)await send(last.content)}
  $('chatForm').addEventListener('submit',e=>{e.preventDefault();send()});
  $('prompt').addEventListener('input',()=>{resizeInput();$('sendBtn').disabled=busy||(!$('prompt').value.trim()&&!attached.length);$('sendBtn').setAttribute('aria-disabled',String($('sendBtn').disabled));});
  $('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
  function resizeInput(){
    const input=$('prompt');
    input.style.height='auto';
    const maxHeight=window.matchMedia('(max-width: 700px)').matches?Math.min(150,Math.round((window.visualViewport?.height||window.innerHeight)*0.22)):180;
    input.style.height=Math.min(input.scrollHeight,maxHeight)+'px';
  }
  // Android browsers can keep the layout viewport behind the software keyboard.
  // Track the visible viewport so the composer and send button stay above it.
  function syncVisibleViewport(){
    const vv=window.visualViewport;
    const height=vv?.height||window.innerHeight;
    document.documentElement.style.setProperty('--app-height',Math.round(height)+'px');
  }
  syncVisibleViewport();
  window.addEventListener('resize',syncVisibleViewport,{passive:true});
  window.visualViewport?.addEventListener('resize',syncVisibleViewport,{passive:true});
  window.visualViewport?.addEventListener('scroll',syncVisibleViewport,{passive:true});
  $('prompt').addEventListener('focus',()=>{
    syncVisibleViewport();
    requestAnimationFrame(()=>{$('chatArea').scrollTop=$('chatArea').scrollHeight;resizeInput();});
  });
  $('newChat').onclick=newChat;$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');
  document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{ $('prompt').value=b.dataset.prompt;resizeInput();send(b.dataset.prompt)});
  $('attachBtn').onclick=()=>$('fileInput').click();
  $('fileInput').addEventListener('change',async e=>{
    for(const f of e.target.files){if(f.size>5*1024*1024){toast(f.name+' is over 5 MB');continue}if(f.type.startsWith('image/')){const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});attached.push({name:f.name,type:f.type,data})}else{try{attached.push({name:f.name,type:f.type||'text/plain',data:await f.text()})}catch{toast('Could not read '+f.name)}}}
    updateAttachments();e.target.value=''
  });
  function updateAttachments(){let el=document.getElementById('attachmentNotice');if(!attached.length){el?.remove()}else{if(!el){el=document.createElement('div');el.id='attachmentNotice';el.style.cssText='font-size:12px;color:#c6b3f4;padding:4px 7px';$('composer-bottom');document.querySelector('.composer').insertBefore(el,document.querySelector('.composer-bottom'))}el.textContent='📎 '+attached.map(f=>f.name).join(', ')+'  ·  click + to add more'}$('sendBtn').disabled=busy||(!$('prompt').value.trim()&&!attached.length)}
  $('settingsBtn').onclick=openSettings;
  function openSettings(){
    $('modalRoot').innerHTML='<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><h2 id="settingsTitle">Chat settings</h2><label for="systemPrompt">System instructions</label><textarea id="systemPrompt" rows="4" style="width:100%;background:#101116;border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--text);resize:vertical"></textarea><label for="temperature">Creativity <span id="tempVal"></span></label><input id="temperature" type="range" min="0" max="2" step=".1" style="padding:0"><label for="maxTokens">Maximum response tokens</label><select id="maxTokens"><option value="1024">1,024</option><option value="2048">2,048</option><option value="4096">4,096</option><option value="8192">8,192</option></select><div class="modal-actions"><button class="muted-btn" id="cancelSettings">Cancel</button><button class="primary" id="saveSettings">Save settings</button></div></section></div>';
    $('systemPrompt').value=settings.system;$('temperature').value=settings.temperature;$('maxTokens').value=settings.maxTokens;$('tempVal').textContent=settings.temperature;
    $('temperature').oninput=()=>$('tempVal').textContent=$('temperature').value;
    $('cancelSettings').onclick=()=>$('modalRoot').innerHTML='';
    $('saveSettings').onclick=()=>{settings={system:$('systemPrompt').value.trim()||'You are a helpful AI assistant.',temperature:Number($('temperature').value),maxTokens:Number($('maxTokens').value)};localStorage.setItem('nova.settings',JSON.stringify(settings));$('modalRoot').innerHTML='';toast('Settings saved')}
  }
  $('exportBtn').onclick=()=>{const c=current();if(!c){toast('Open a conversation to export it');return}const blob=new Blob([JSON.stringify(c,null,2)],{type:'application/json'});download(blob,(c.title||'nova-chat').replace(/[^a-z0-9-_]/gi,'_')+'.json')};
  $('clearBtn').onclick=()=>{if(confirm('Delete every saved conversation in this browser? This cannot be undone.')){chats=[];currentId=null;save();renderHistory();renderChat();toast('All chats cleared')}};
  function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  $('signInBtn').onclick=async()=>{try{if(!window.puter?.auth){toast('Puter.js is not ready yet');return}if(puter.auth.isSignedIn()){const u=await puter.auth.getUser();toast('Signed in'+(u?.username?' as '+u.username:''))}else{await puter.auth.signIn();toast('Puter sign-in completed')}}catch(e){toast(e?.message||'Sign-in cancelled')}};
  let light=false;$('themeBtn').onclick=()=>{light=!light;document.documentElement.style.colorScheme=light?'light':'dark';document.documentElement.style.setProperty('--bg',light?'#f6f5fa':'#101116');document.documentElement.style.setProperty('--panel',light?'#ffffff':'#17181f');document.documentElement.style.setProperty('--panel2',light?'#eceaf2':'#20212a');document.documentElement.style.setProperty('--line',light?'#dedbe7':'#2b2d38');document.documentElement.style.setProperty('--text',light?'#20202a':'#f4f4f7');document.documentElement.style.setProperty('--muted',light?'#666577':'#a0a2b2');$('themeBtn').textContent=light?'☾':'☼'};
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();newChat()}if(e.key==='Escape'){$('modalRoot').innerHTML='';$('sidebar').classList.remove('open')}});
  renderHistory();renderChat();loadModels();$('sendBtn').disabled=true;$('sendBtn').setAttribute('aria-disabled','true');
})();
</script>

<script>
// Register Nova's service worker when served from HTTPS or localhost.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Nova offline support unavailable:', err)));
}
</script>
